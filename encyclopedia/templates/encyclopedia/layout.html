{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Wiki{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" 
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" 
          crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'encyclopedia/styles.css' %}">
</head>
<body>
    <div class="container-fluid">
        <div class="row vh-100">
            <!-- Sidebar -->
            <nav class="sidebar col-lg-2 col-md-3 bg-light p-3">
                <h2>Wiki</h2>

                <!-- Búsqueda -->
                <form action="/search/" method="get" class="mb-3">
                    <input type="text" name="q" placeholder="Search Encyclopedia" class="form-control mb-1">
                    <input type="submit" value="Search" class="btn btn-primary btn-sm btn-block">
                </form>

                <div class="mb-2">
                    <a href="/" class="btn btn-outline-secondary btn-block">Home</a>
                </div>
                <div class="mb-2">
                    <a href="/new/" class="btn btn-outline-success btn-block">Create New Page</a>
                </div>
                <div class="mb-2">
                    <a href="/random/" class="btn btn-outline-warning btn-block">Random Page</a>
                </div>

                {% block nav %}
                <!-- Para enlaces adicionales si hace falta -->
                {% endblock %}
            </nav>

            <!-- Main content -->
            <main class="main col-lg-10 col-md-9 p-4 overflow-auto">
                <div class="main col-lg-10 col-md-9">
                    {% block body %}
                    {% endblock %}
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" 
            integrity="sha384-J6qa4849blE2+poTjqCkR+rJtCkRxK9D4F7Q2tHFOZ69p2ckE4pG3fE4FjQkz1xV" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" 
            integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldnv0OSh8Y0zV+vZ1MQujmn0Xr6j6Z/gxgqTRi" 
            crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" 
            integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" 
            crossorigin="anonymous"></script>
</body>
</html>
